<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Hospital - Ecrã 1: Triagem</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; }
        .campo { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #219152; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Admissão e Triagem</h2>
        <hr>
        <br>
        
        <div class="campo">
            <label>Nome Completo do Paciente:</label>
            <input type="text" id="nome" placeholder="Ex: John Doe">
        </div>
        
        <div class="campo">
            <label>Número de Utente de Saúde:</label>
            <input type="text" id="numUtente" placeholder="Ex: 123456789">
        </div>
        
        <div class="campo">
            <label>Data de Nascimento:</label>
            <input type="date" id="dataNasc">
        </div>

        <div class="campo">
            <label>Temperatura (°C):</label>
            <input type="number" step="0.1" id="temp" placeholder="Ex: 36.5">
        </div>
        
        <button onclick="salvarPaciente()">Dar Entrada no Hospital</button>
        
        <p id="mensagemSucesso" style="margin-top:15px; font-weight:bold; color: #27ae60;"></p>
    </div>

    <script>
        function salvarPaciente() {
            // Esta função avisa que o botão foi clicado. 
            // Mais à frente, ela vai usar a API para enviar estes dados para o Java!
            const nomePaciente = document.getElementById('nome').value;
            
            if (nomePaciente === "") {
                alert("Por favor, introduza o nome do paciente.");
            } else {
                document.getElementById('mensagemSucesso').innerText = "✅ Paciente " + nomePaciente + " enviado para a fila do Dr. Leandro Rodrigues!";
            }
        }
    </script>
</body>
</html>
